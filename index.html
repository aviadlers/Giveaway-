<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adlers TV | Prize Wheel</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #FFD700;
  --gold-dark: #E5C100;
  --dark: #0D0D0D;
  --dark-light: #1A1A1A;
  --accent: #FF6B35;
  --text-light: #FFF;
  --glass-bg: rgba(255,255,255,0.05);
  --confetti-colors: #FFD700, #FF6B35, #FF4500, #FFF;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
  background: linear-gradient(135deg, #0D0D0D, #1A1A1A);
  color: var(--text-light);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  min-height:100vh;
  padding:20px;
  overflow-x:hidden;
}

header{
  text-align:center;
  margin-bottom:40px;
}

header h1{
  font-size:3rem;
  font-weight:800;
  background: linear-gradient(45deg,var(--gold),var(--accent));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 10px rgba(255,215,0,0.6);
}

header h2{
  font-size:1.2rem;
  font-weight:500;
  color: rgba(255,255,255,0.7);
  margin-top:8px;
}

header .tagline{
  font-size:1rem;
  font-weight:600;
  padding:6px 20px;
  border-radius:20px;
  background: rgba(255,215,0,0.15);
  color: var(--gold);
  margin-top:10px;
  display:inline-block;
}

.wheel-container{
  position: relative;
  width:350px;
  height:350px;
  margin-bottom:30px;
  perspective:1000px;
}

.wheel{
  width:100%;
  height:100%;
  border-radius:50%;
  border:12px solid var(--gold);
  overflow:hidden;
  position:relative;
  transform:rotate(0deg);
  transition: transform 4s cubic-bezier(0.17,0.67,0.83,0.67);
  box-shadow: 0 0 15px rgba(255,215,0,0.3), 0 10px 40px rgba(0,0,0,0.5);
}

.wheel.spinning{
  animation: glowWheel 1.5s infinite alternate;
}

.segment{
  position:absolute;
  width:50%;
  height:50%;
  left:0; top:0;
  transform-origin: bottom right;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.segment-content{
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-weight:700;
  color:#FFF;
  text-shadow:0 0 5px rgba(0,0,0,0.8);
}

.pointer-container{
  position:absolute;
  top:-25px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
}

.pointer{
  width:50px;
  height:50px;
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  background: var(--gold);
  position: relative;
}

.pointer::after{
  content:'';
  position:absolute;
  top:8px; left:8px; right:8px; height:20px;
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  background: rgba(255,215,0,0.6);
}

button{
  cursor:pointer;
  font-weight:700;
  border:none;
  border-radius:50px;
  padding:15px 40px;
  background: linear-gradient(135deg,var(--gold),var(--accent));
  color:#000;
  font-size:1.2rem;
  box-shadow:0 5px 15px rgba(255,215,0,0.4);
  transition: all 0.3s ease;
}

button:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 20px rgba(255,215,0,0.6);
}

.stats{
  display:flex;
  justify-content:space-between;
  margin-top:25px;
  width:100%;
  max-width:500px;
}

.stat-box{
  background: var(--glass-bg);
  flex:1;
  margin:0 5px;
  padding:15px;
  border-radius:15px;
  text-align:center;
  backdrop-filter: blur(10px);
  border:1px solid rgba(255,215,0,0.2);
}

.stat-value{
  font-size:2rem;
  font-weight:800;
  color:var(--gold);
}

.stat-label{
  font-size:0.8rem;
  color:rgba(255,255,255,0.7);
  margin-top:5px;
}

/* Animations */
@keyframes glowWheel{
  0%{box-shadow:0 0 10px rgba(255,215,0,0.3),0 15px 40px rgba(0,0,0,0.5);}
  100%{box-shadow:0 0 20px rgba(255,215,0,0.7),0 15px 50px rgba(0,0,0,0.5);}
}

@keyframes spinWheel{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}

.confetti{
  position:fixed;
  width:10px;
  height:10px;
  background:red;
  pointer-events:none;
  z-index:1000;
  animation:confettiFall 3s linear forwards;
}

@keyframes confettiFall{
  0%{opacity:1; transform:translateY(0) rotate(0deg);}
  100%{opacity:0; transform:translateY(600px) rotate(720deg);}
}

/* Admin page */
.admin-page{
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: var(--dark);
  padding:50px;
  flex-direction:column;
  align-items:center;
  overflow-y:auto;
}

.admin-page.active{
  display:flex;
}

.admin-page h2{
  font-size:2rem;
  margin-bottom:20px;
  background: linear-gradient(45deg,var(--gold),var(--accent));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.admin-page label{
  margin-top:10px;
  display:block;
  font-weight:600;
}

.admin-page input{
  width:300px;
  padding:10px;
  margin-top:5px;
  border-radius:8px;
  border:none;
  background: var(--glass-bg);
  color:#FFF;
  backdrop-filter:blur(5px);
}

.admin-page button{
  margin-top:20px;
}

</style>
</head>
<body>

<header>
<h1>ADLERS TV</h1>
<h2>Presents</h2>
<div class="tagline">PRIZE BONANZA WHEEL</div>
</header>

<div class="wheel-container">
  <div class="pointer-container"><div class="pointer"></div></div>
  <div class="wheel" id="wheel"></div>
</div>

<button id="spinBtn">SPIN TO WIN!</button>

<div class="stats">
  <div class="stat-box">
    <div class="stat-value" id="prizesLeft">30</div>
    <div class="stat-label">Prizes Left</div>
  </div>
  <div class="stat-box">
    <div class="stat-value" id="spinsDone">0</div>
    <div class="stat-label">Total Spins</div>
  </div>
</div>

<button id="adminBtn">Admin Panel 🔒</button>

<div class="admin-page" id="adminPage">
<h2>Admin Settings</h2>
<label>Password</label>
<input type="password" id="adminPass" placeholder="Enter password">
<label>Total Prizes</label>
<input type="number" id="totalPrizesInput" value="30">
<label>Segment Names (comma separated)</label>
<input type="text" id="segmentsInput" value="Mega,Big,Great,Good,Nice,Small,Frequent,Common">
<label>Segment Values (comma separated)</label>
<input type="text" id="valuesInput" value="20,15,10,5,4,3,2,1">
<label>Segment Colors (comma separated hex)</label>
<input type="text" id="colorsInput" value="#FFD700,#FFB347,#FFA500,#FF6B35,#FF4500,#F08080,#DA70D6,#9370DB">
<button id="saveAdmin">Save & Close</button>
</div>

<script>
// Config
let config={
segments:["Mega","Big","Great","Good","Nice","Small","Frequent","Common"],
values:[20,15,10,5,4,3,2,1],
colors:["#FFD700","#FFB347","#FFA500","#FF6B35","#FF4500","#F08080","#DA70D6","#9370DB"],
totalPrizes:30
};

let state={prizesLeft:config.totalPrizes,spinsDone:0};

// Generate wheel
function drawWheel(){
  const wheel=document.getElementById("wheel");
  wheel.innerHTML="";
  const segCount=config.segments.length;
  const angle=360/segCount;
  config.segments.forEach((name,i)=>{
    const seg=document.createElement("div");
    seg.className="segment";
    seg.style.transform=`rotate(${i*angle}deg)`;
    const content=document.createElement("div");
    content.className="segment-content";
    content.style.color=config.colors[i%config.colors.length];
    content.innerHTML=`${config.values[i]}<br>${name}`;
    seg.appendChild(content);
    wheel.appendChild(seg);
  });
}

// Spin
function spinWheel(){
  if(state.prizesLeft<=0) return;
  const wheel=document.getElementById("wheel");
  const segments=config.segments.length;
  const rand=Math.floor(Math.random()*segments);
  const anglePer=360/segments;
  const finalRotation=360*5+(360-(rand*anglePer+anglePer/2));
  wheel.style.transition="transform 4s cubic-bezier(0.17,0.67,0.83,0.67)";
  wheel.style.transform=`rotate(${finalRotation}deg)`;
  wheel.classList.add("spinning");
  setTimeout(()=>{
    wheel.classList.remove("spinning");
    wheel.style.transition="none";
    const prize=config.values[rand];
    state.prizesLeft-=prize;
    if(state.prizesLeft<0) state.prizesLeft=0;
    state.spinsDone++;
    document.getElementById("prizesLeft").innerText=state.prizesLeft;
    document.getElementById("spinsDone").innerText=state.spinsDone;
    launchConfetti();
    if(state.prizesLeft<=0) alert("Giveaway Complete!");
  },4000);
}

// Confetti
function launchConfetti(){
  for(let i=0;i<30;i++){
    const conf=document.createElement("div");
    conf.className="confetti";
    conf.style.left=Math.random()*window.innerWidth+"px";
    conf.style.background=config.colors[Math.floor(Math.random()*config.colors.length)];
    document.body.appendChild(conf);
    setTimeout(()=>conf.remove(),3000);
  }
}

// Admin Panel
document.getElementById("adminBtn").addEventListener("click",()=>{
  const pwd=prompt("Enter Admin Password");
  if(pwd==="adlers123"){
    document.getElementById("adminPage").classList.add("active");
  } else alert("Wrong password!");
});

document.getElementById("saveAdmin").addEventListener("click",()=>{
  const names=document.getElementById("segmentsInput").value.split(",");
  const vals=document.getElementById("valuesInput").value.split(",").map(Number);
  const cols=document.getElementById("colorsInput").value.split(",");
  const total=parseInt(document.getElementById("totalPrizesInput").value);
  if(names.length===vals.length && vals.length===cols.length){
    config.segments=names;
    config.values=vals;
    config.colors=cols;
    config.totalPrizes=total;
    state.prizesLeft=total;
    state.spinsDone=0;
    document.getElementById("prizesLeft").innerText=state.prizesLeft;
    document.getElementById("spinsDone").innerText=state.spinsDone;
    drawWheel();
    document.getElementById("adminPage").classList.remove("active");
  } else alert("Arrays lengths must match!");
});

document.getElementById("spinBtn").addEventListener("click",spinWheel);

drawWheel();
</script>
</body>
</html>
