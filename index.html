<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adlers TV | Prize Wheel</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    background: #111;
    font-family: Poppins, sans-serif;
    color: white;
    text-align: center;
}

h1 {
    margin-top: 25px;
    font-size: 30px;
}

#wheelContainer {
    margin: 40px auto;
    width: 350px;
    height: 350px;
    position: relative;
}

#wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 6px solid gold;
    box-shadow: 0 0 20px gold;
    overflow: hidden;
    position: relative;
}

.segment {
    position: absolute;
    width: 50%;
    height: 50%;
    left: 50%;
    top: 50%;
    transform-origin: 0% 0%;
    border: 1px solid #000;
    display: flex;
    justify-content: center;
    align-items: center;
}

.segment span {
    writing-mode: vertical-rl;
    font-size: 13px;
    font-weight: 700;
}

#pointer {
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-bottom: 35px solid red;
    margin: 0 auto;
}

#spinBtn {
    padding: 12px 25px;
    margin-top: 25px;
    background: gold;
    color: black;
    border: none;
    font-size: 18px;
    font-weight: 700;
    border-radius: 8px;
    cursor: pointer;
}

#spinBtn:hover {
    box-shadow: 0 0 15px gold;
}

#adminBtn {
    padding: 10px 20px;
    margin-top: 15px;
    background: #333;
    color: white;
    border: 1px solid gold;
    border-radius: 8px;
    cursor: pointer;
}

/* POPUP */
#popup {
    display: none;
    position: fixed;
    left: 0; top: 0;
    width: 100%; height: 100%;
    backdrop-filter: blur(6px);
    justify-content: center;
    align-items: center;
}

#popupBox {
    background: #222;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 0 20px gold;
}

/* ADMIN PANEL */
#adminPanel {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    backdrop-filter: blur(8px);
    background: rgba(0,0,0,0.8);
    padding-top: 40px;
}

textarea {
    width: 80%;
    max-width: 350px;
    height: 150px;
}

#adminBox {
    background: #222;
    padding: 20px;
    margin: auto;
    border-radius: 12px;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 0 20px gold;
}

#passwordInput {
    width: 80%;
    max-width: 300px;
    padding: 12px;
}
</style>
</head>
<body>

<h1>🎡 Adlers TV Prize Wheel</h1>

<div id="pointer"></div>
<div id="wheelContainer"><div id="wheel"></div></div>

<button id="spinBtn">SPIN</button>
<br>
<button id="adminBtn">Admin Panel</button>

<!-- POPUP -->
<div id="popup">
    <div id="popupBox">
        <h2 id="prizeText"></h2>
        <button onclick="closePopup()">OK</button>
    </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
    <div id="adminBox">

        <div id="loginArea">
            <h2>Admin Login</h2>
            <input type="password" id="passwordInput" placeholder="Enter Password">
            <br><br>
            <button onclick="checkPassword()">Login</button>
        </div>

        <div id="editArea" style="display:none;">
            <h2>Edit Prizes (One per line)</h2>
            <textarea id="prizeBox"></textarea>
            <br><br>
            <button onclick="savePrizes()">SAVE</button>
            <button onclick="closeAdmin()">CLOSE</button>
        </div>

    </div>
</div>

<!-- CONFETTI -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
// --------------------
// DEFAULT OR SAVED PRIZES
// --------------------
let prizes = JSON.parse(localStorage.getItem("prizes")) || ["100", "200", "50", "Try Again"];

// --------------------
// DRAW WHEEL
// --------------------
function drawWheel() {
    const wheel = document.getElementById("wheel");
    wheel.innerHTML = "";
    const angle = 360 / prizes.length;

    prizes.forEach((p, i) => {
        let seg = document.createElement("div");
        seg.className = "segment";

        seg.style.background = "#" + Math.floor(Math.random()*16777215).toString(16);
        seg.style.transform = `rotate(${i * angle}deg) skewY(${90 - angle}deg)`;

        let text = document.createElement("span");
        text.innerText = p;

        seg.appendChild(text);
        wheel.appendChild(seg);
    });
}

drawWheel();

// --------------------
// SPIN
// --------------------
let spinning = false;
let rotation = 0;

document.getElementById("spinBtn").onclick = function() {
    if (spinning) return;
    spinning = true;

    const wheel = document.getElementById("wheel");
    const angle = 360 / prizes.length;
    const landing = Math.floor(Math.random() * prizes.length);

    const fullTurns = 360 * (5 + Math.random() * 5);
    rotation += fullTurns + (360 - landing * angle);

    wheel.style.transition = "6s ease-out";
    wheel.style.transform = `rotate(${rotation}deg)`;

    setTimeout(() => {
        showPrize(prizes[landing]);

        confetti({
            particleCount: 120,
            spread: 70,
            origin: { y: 0.6 }
        });

        spinning = false;
    }, 6000);
};

function showPrize(p) {
    document.getElementById("prizeText").innerText = "You Won: " + p;
    document.getElementById("popup").style.display = "flex";
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
}

// --------------------
// ADMIN
// --------------------
document.getElementById("adminBtn").onclick = function() {
    document.getElementById("adminPanel").style.display = "block";
};

function closeAdmin() {
    document.getElementById("adminPanel").style.display = "none";
}

const ADMIN_PASSWORD = "adlers123";

function checkPassword() {
    const input = document.getElementById("passwordInput").value;
    if (input === ADMIN_PASSWORD) {
        document.getElementById("loginArea").style.display = "none";
        document.getElementById("editArea").style.display = "block";

        document.getElementById("prizeBox").value = prizes.join("\n");
    } else {
        alert("Incorrect Password!");
    }
}

function savePrizes() {
    const lines = document.getElementById("prizeBox").value
        .split("\n")
        .map(x => x.trim())
        .filter(x => x !== "");

    prizes = lines;
    localStorage.setItem("prizes", JSON.stringify(prizes));

    drawWheel();

    alert("Saved!");
}
</script>

</body>
</html>
