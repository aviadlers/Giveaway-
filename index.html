<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adler's TV Noodle Count Wheel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }

        .logo {
            font-size: 2.5em;
            font-weight: bold;
            color: #ff6b35;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.2em;
        }

        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto 30px;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 8px solid #ff6b35;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.83, 0.67);
            transform: rotate(0deg);
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        .segment {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: bottom right;
            left: 0;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.3em;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .segment-content {
            transform: rotate(45deg);
            text-align: center;
        }

        .noodle-count {
            font-size: 1.8em;
            display: block;
        }

        .noodle-text {
            font-size: 0.7em;
            display: block;
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: #ff6b35;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            z-index: 10;
        }

        .spin-button {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 107, 53, 0.4);
            margin-bottom: 20px;
        }

        .spin-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 53, 0.6);
        }

        .spin-button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            background: #fff9e6;
            border-radius: 15px;
            border-left: 5px solid #ff6b35;
            display: none;
        }

        .result.show {
            display: block;
            animation: popIn 0.5s ease;
        }

        .result-title {
            font-weight: bold;
            color: #ff6b35;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .result-prize {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }

        .noodle-emoji {
            font-size: 1.5em;
            margin: 0 5px;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .instructions {
            margin-top: 20px;
            color: #666;
            font-size: 0.9em;
        }

        .supply-counter {
            margin-top: 15px;
            padding: 10px;
            background: #f0f8ff;
            border-radius: 10px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">ADLER'S TV</div>
        <div class="subtitle">NOODLE COUNT WHEEL</div>
        
        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="wheel" id="wheel">
                <!-- Segments will be generated by JavaScript -->
            </div>
        </div>

        <button class="spin-button" id="spinButton">SPIN THE WHEEL!</button>
        
        <div class="result" id="result">
            <div class="result-title">CONGRATULATIONS! YOU WON:</div>
            <div class="result-prize" id="prizeText"></div>
        </div>

        <div class="supply-counter" id="supplyCounter">
            Noodles Remaining: <span id="noodlesLeft">30</span> 🍜
        </div>

        <div class="instructions">
            Spin to win 1, 2, or 3 noodles! Perfect for multiple giveaways!
        </div>
    </div>

    <script>
        // Updated for 1, 2, 3 noodles to maximize giveaways
        const noodleCounts = [
            { count: 1, color: '#FF6B35' },
            { count: 2, color: '#F7931E' },
            { count: 3, color: '#2E86AB' },
            { count: 1, color: '#A23B72' },
            { count: 2, color: '#F18F01' },
            { count: 3, color: '#C73E1D' },
            { count: 1, color: '#3BB273' },
            { count: 2, color: '#7768AE' },
            { count: 1, color: '#FF9999' },
            { count: 2, color: '#66B3FF' },
            { count: 3, color: '#99FF99' },
            { count: 1, color: '#FFD700' }
        ];

        const wheel = document.getElementById('wheel');
        const spinButton = document.getElementById('spinButton');
        const result = document.getElementById('result');
        const prizeText = document.getElementById('prizeText');
        const noodlesLeftElement = document.getElementById('noodlesLeft');
        
        let totalNoodles = 30;
        let spinsCompleted = 0;

        // Create wheel segments
        function createWheelSegments() {
            const segmentAngle = 360 / noodleCounts.length;
            
            noodleCounts.forEach((noodle, index) => {
                const segment = document.createElement('div');
                segment.className = 'segment';
                
                // Calculate rotation angle for this segment
                const rotation = index * segmentAngle;
                segment.style.transform = `rotate(${rotation}deg)`;
                segment.style.backgroundColor = noodle.color;
                
                const content = document.createElement('div');
                content.className = 'segment-content';
                content.innerHTML = `
                    <span class="noodle-count">${noodle.count}</span>
                    <span class="noodle-text">NOODLE${noodle.count > 1 ? 'S' : ''}</span>
                `;
                
                segment.appendChild(content);
                wheel.appendChild(segment);
            });
        }

        // Spin the wheel
        function spinWheel() {
            if (totalNoodles <= 0) {
                alert("No more noodles left! Giveaway complete!");
                return;
            }

            // Disable button during spin
            spinButton.disabled = true;
            result.classList.remove('show');
            
            // Random rotation (multiple full rotations + segment offset)
            const extraRotations = 5; // Minimum full rotations
            const segmentAngle = 360 / noodleCounts.length;
            const randomSegment = Math.floor(Math.random() * noodleCounts.length);
            const finalRotation = (extraRotations * 360) + (360 - (randomSegment * segmentAngle));
            
            // Apply spin animation
            wheel.style.transform = `rotate(${finalRotation}deg)`;
            
            // Show result after spin completes
            setTimeout(() => {
                const winningNoodles = noodleCounts[randomSegment];
                
                // Check if we have enough noodles
                if (totalNoodles >= winningNoodles.count) {
                    totalNoodles -= winningNoodles.count;
                    spinsCompleted++;
                    
                    prizeText.innerHTML = `
                        ${winningNoodles.count} <span class="noodle-emoji">🍜</span> NOODLE${winningNoodles.count > 1 ? 'S' : ''}!
                        <div style="font-size: 0.6em; margin-top: 10px; color: #666;">
                            ${spinsCompleted} giveaway${spinsCompleted > 1 ? 's' : ''} completed
                        </div>
                    `;
                    noodlesLeftElement.textContent = totalNoodles;
                    
                    result.classList.add('show');
                    celebrateWin(winningNoodles.count);
                } else {
                    // Not enough noodles for this prize, try a smaller one
                    prizeText.innerHTML = `
                        Only ${totalNoodles} noodles left!<br>
                        Final spin coming up!
                    `;
                    result.classList.add('show');
                }
                
                spinButton.disabled = false;
                
                // If running low, update button text
                if (totalNoodles < 3) {
                    spinButton.textContent = `FINAL SPINS! (${totalNoodles} left)`;
                }
                
                // If no noodles left, disable spinning
                if (totalNoodles <= 0) {
                    spinButton.disabled = true;
                    spinButton.textContent = "GIVEAWAY COMPLETE!";
                    spinButton.style.background = '#4CAF50';
                }
            }, 4000);
        }

        // Simple celebration effect
        function celebrateWin(count) {
            // Different celebrations based on win size
            if (count === 3) {
                document.body.style.background = 'linear-gradient(135deg, #4CAF50, #8BC34A)';
                setTimeout(() => {
                    document.body.style.background = 'linear-gradient(135deg, #ff6b35, #f7931e)';
                }, 1000);
            }
        }

        // Initialize the wheel
        createWheelSegments();

        // Event listeners
        spinButton.addEventListener('click', spinWheel);

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !spinButton.disabled) {
                spinWheel();
            }
        });
    </script>
</body>
</html>
